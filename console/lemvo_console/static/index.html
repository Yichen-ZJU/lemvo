<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lemvo · Research Console</title>
<style>
:root{color-scheme:dark;--bg:#0a100e;--panel:#101a16;--raised:#15211b;--line:#25372d;--text:#e0ebe4;--muted:#91a397;--mint:#b6f5d4;--amber:#edc483;--red:#f0a5a2;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button,input,textarea,select{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}button{padding:8px 13px}button:hover:not(:disabled){border-color:var(--mint)}input,select{padding:8px 12px}textarea{padding:12px;width:100%;resize:vertical;min-height:92px}a{color:var(--mint)}.shell{max-width:1580px;margin:auto;padding:0 32px 48px}.top{display:flex;align-items:center;justify-content:space-between;height:90px;border-bottom:1px solid var(--line);gap:16px}.brand{display:flex;align-items:baseline;gap:16px}.logo{font-size:33px;letter-spacing:-1.8px;font-weight:750;color:var(--mint)}.eyebrow{font:11px var(--mono);letter-spacing:2px;color:var(--muted);text-transform:uppercase}.topright{display:flex;gap:12px;align-items:center}.dot{height:7px;width:7px;background:var(--mint);border-radius:50%;display:inline-block;margin-right:8px}.stale .dot{background:var(--amber)}.title{display:flex;justify-content:space-between;align-items:end;margin:30px 0 22px;gap:24px}h1{font-size:29px;letter-spacing:-.6px;margin:3px 0 5px}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:var(--mono)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}.stat{background:var(--panel);border:1px solid var(--line);padding:17px 20px;border-radius:12px}.stat strong{display:block;font-size:27px;font-weight:550;color:var(--mint)}.stat span{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:22px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input{width:100%;min-width:0}.section-label{font:11px var(--mono);letter-spacing:1.6px;color:var(--muted);margin:20px 0 10px}.session{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:17px;margin-bottom:10px;transition:border-color .15s}.session.selected{border-color:var(--mint);box-shadow:inset 3px 0 0 var(--mint)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.session-name{font-weight:600;font-size:15px;overflow-wrap:anywhere}.path{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:11px;color:var(--muted);margin:7px 0}.badge{font:10px var(--mono);padding:3px 7px;border:1px solid var(--line);border-radius:5px;white-space:nowrap}.phase{color:var(--mint)}.warning{color:var(--amber)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px;min-width:0}.panel-head{display:flex;align-items:start;justify-content:space-between;gap:15px;margin-bottom:16px}.details-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.metric small{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}.metric div{overflow-wrap:anywhere}.notice{padding:11px 14px;border:1px solid #60513b;border-radius:8px;background:#2a251b;color:var(--amber);margin:12px 0;font-size:12px}.notice.quiet{border-color:var(--line);background:var(--raised);color:var(--muted)}.job{padding:16px 0;border-top:1px solid var(--line)}.job:first-of-type{border-top:0}.progress{height:5px;background:var(--line);border-radius:3px;margin:12px 0 7px;overflow:hidden}.progress>span{display:block;background:var(--mint);height:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.65 var(--mono);max-height:240px;overflow:auto;background:#0b120e;padding:13px;border:1px solid var(--line);border-radius:8px;margin:10px 0 0}.messages{max-height:350px;overflow:auto}.message{padding:12px 0;border-bottom:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}.message b{display:block;color:var(--muted);font:10px var(--mono);letter-spacing:1px;margin-bottom:5px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.primary{color:#0a160f;background:var(--mint);border-color:var(--mint);font-weight:600}.empty{padding:42px 22px;text-align:center;color:var(--muted)}.footer{border-top:1px solid var(--line);margin-top:26px;padding-top:16px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.login{max-width:480px;margin:100px auto;padding:32px}.login input{width:100%;margin:16px 0}.hidden{display:none!important}.gpu{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:6px;margin:4px 5px 0 0;font:11px var(--mono)}details{margin-top:10px}summary{cursor:pointer;color:var(--muted);font-size:12px}.hoststrip{margin-bottom:22px}.pill{font-size:12px;color:var(--muted)}#error{margin-bottom:20px}.count{color:var(--muted);font:12px var(--mono)}.navbutton{border:0;background:none;color:var(--muted);padding:3px 7px}.event{border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.toast{position:fixed;bottom:25px;right:25px;max-width:500px;z-index:10;border:1px solid var(--mint);background:var(--raised);padding:15px 20px;border-radius:10px;box-shadow:0 10px 40px #0008}
@media(max-width:850px){.shell{padding:0 16px 30px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.brand .eyebrow{display:none}.top{height:72px}.title{align-items:start;flex-direction:column;gap:10px}.details-grid{grid-template-columns:repeat(2,1fr)}#sessions{max-height:390px;overflow:auto}.footer{flex-direction:column}.topright{gap:3px}.panel{padding:17px}}
</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><span class="logo">Lemvo.</span><span class="eyebrow">Research Console / Single Host</span></div><div class="topright"><span id="connection" class="small muted"><i class="dot"></i>连接中</span><button id="language" class="navbutton">EN</button><button id="logout" class="navbutton">锁定</button></div></header>
<section id="login" class="panel login"><span class="eyebrow">YOUR RESEARCH, IN VIEW</span><h1>连接本机控制台</h1><p class="muted">使用服务器输出的完整链接，或粘贴控制台访问令牌。令牌仅保存在当前浏览器会话。</p><input type="password" id="token" placeholder="Console token" autocomplete="off"><button id="connect" class="primary">连接</button></section>
<main id="main" class="hidden">
<div class="title"><div><span class="eyebrow" id="hostLabel">HOST OVERVIEW</span><h1 id="pageTitle">研究正在如何推进</h1><div id="host" class="muted mono small"></div></div><span class="pill" id="refreshNote">每 5 秒更新 · 无模型轮询</span></div>
<div id="error" class="notice hidden"></div>
<div class="stats" id="stats"></div><div id="hardware" class="hoststrip"></div>
<div class="layout"><aside><div class="toolbar"><input id="search" placeholder="查找项目、对话或 PID"><select id="filter" aria-label="Filter"><option value="all">全部</option><option value="attention">需关注</option><option value="waiting">等回复</option></select></div><div class="section-label" id="sessionLabel">CONVERSATIONS</div><div id="sessions"></div><div class="section-label" id="projectLabel">REGISTERED PROJECTS</div><div id="projects"></div></aside>
<article><div id="detail"></div><section class="panel"><div class="panel-head"><h2 id="controlTitle">项目控制</h2><span class="badge">LEMVO RUNNER</span></div><div id="controlHint" class="muted small"></div><div class="controls"><button id="guided">半自动</button><button id="unattended">全自动</button></div><textarea id="steer" placeholder="为当前项目留下下一轮指导…"></textarea><div class="row" style="margin-top:10px"><span class="small muted" id="deliveryHint">指导通过现有队列投递，轮边界生效。</span><button id="send" class="primary">发送指导</button></div><div id="receipt" class="small muted" style="margin-top:12px"></div></section><section class="panel"><div class="panel-head"><h2 id="eventsTitle">状态时间线</h2><span class="small muted" id="eventsHint">仅状态变化</span></div><div id="events"></div></section></article></div>
<footer class="footer"><span id="policy">监护只观察与提示，不自动中断训练，也不评价研究方向。</span><span class="mono">LEMVO CONSOLE v0.1 · LOCAL</span></footer>
</main></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang=localStorage.getItem('lemvo-console-lang')||'zh', token=sessionStorage.getItem('lemvo-console-token')||'', snap=null, selected=null, selectedProject=null, lastDetailKey=null, busy=false, timer=null, delivery=null;
const hash=new URLSearchParams(location.hash.slice(1));if(hash.get('token')){token=hash.get('token');sessionStorage.setItem('lemvo-console-token',token);history.replaceState(null,'',location.pathname);}
const t=(zh,en)=>lang==='zh'?zh:en;
const phases={unknown:['进度未知','Progress unknown'],unbound:['仅发现进程','Process only'],model:['等待模型','Waiting for model'],tool_pending:['工具请求待返回','Tool request pending'],loading_model:['加载模型','Loading model'],loading_data:['加载数据','Loading data'],training:['训练中','Training'],evaluating:['评测中','Evaluating'],tool:['执行工具','Running tool'],waiting_job:['观察作业','Observing job'],waiting_user:['等待回复','Awaiting input'],completed:['已完成','Completed'],session_ended:['会话已结束','Session ended']};
const ph=x=>(phases[x]||[x,x])[lang==='zh'?0:1], bytes=n=>n?`${(n/1073741824).toFixed(1)} GB`:'—', ago=n=>!n?'—':(Math.max(0,Math.floor((Date.now()/1000-n)/60))<1?t('刚刚','just now'):Math.floor((Date.now()/1000-n)/60)+t(' 分钟前',' min ago'));
function notice(text,quiet=false){return `<div class="notice ${quiet?'quiet':''}">${esc(text)}</div>`}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),6000)}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d}
function project(){return snap?.projects.find(p=>p.id===selectedProject)}
function select(id,pid){selected=id;selectedProject=pid;render()}
function translate(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('language').textContent=lang==='zh'?'EN':'中文';$('logout').textContent=t('锁定','Lock');$('pageTitle').textContent=t('研究正在如何推进','Your research, in view');$('refreshNote').textContent=t('每 5 秒更新 · 无模型轮询','Updates every 5s · No model polling');$('search').placeholder=t('查找项目、对话或 PID','Search projects, sessions or PID');$('filter').options[0].text=t('全部','All');$('filter').options[1].text=t('需关注','Attention');$('filter').options[2].text=t('等回复','Awaiting input');$('controlTitle').textContent=t('项目控制','Project controls');$('guided').textContent=t('半自动','Guided');$('unattended').textContent=t('全自动','Unattended');$('send').textContent=t('发送指导','Send guidance');$('steer').placeholder=t('为当前项目留下下一轮指导…','Guidance for the selected project…');$('eventsTitle').textContent=t('状态时间线','Activity timeline');$('eventsHint').textContent=t('仅状态变化','State changes only');$('deliveryHint').textContent=t('指导通过现有队列投递，轮边界生效。','Uses the existing queue, delivered at a turn boundary.');$('policy').textContent=t('监护只观察与提示，不自动中断训练，也不评价研究方向。','Observation and alerts only. No automatic training interruption or scientific verdicts.');}
function render(){translate();if(!snap)return;const sessions=snap.sessions||[],projects=snap.projects||[],jobs=projects.flatMap(p=>p.jobs);if(!selectedProject&&projects.length){selectedProject=projects[0].id;selected=sessions.find(s=>s.project_id===selectedProject)?.id||null}const active=sessions.filter(s=>!['session_ended','completed'].includes(s.phase)).length;const stats=[[active,t('已接入会话','Observed sessions')],[jobs.filter(j=>j.alive).length,t('登记运行作业','Registered running jobs')],[sessions.filter(s=>s.health==='attention').length+jobs.filter(j=>j.health==='attention').length,t('关注项（会话 / 作业）','Attention items (sessions / jobs)')],[sessions.filter(s=>s.health==='waiting').length,t('等待回复','Awaiting input')]];$('stats').innerHTML=stats.map(([v,l])=>`<div class="stat"><strong>${v}</strong><span>${l}</span></div>`).join('');$('host').textContent=snap.host+' · '+t('单服务器 / 当前用户','Single host / current user');$('connection').className='small '+(snap.stale?'stale warning':'muted');$('connection').innerHTML='<i class="dot"></i>'+t(snap.stale?'观测已过期':'已连接',snap.stale?'Stale observation':'Connected');$('error').classList.toggle('hidden',!snap.stale&&!snap.error);$('error').textContent=snap.stale?t('采集暂未更新，下面是最后一次观测。控制已禁用。','Collector is not updating. Showing the last observation; controls disabled.'):(snap.error||'');
const h=snap.hardware||{},m=h.memory||{},disk=h.disk||{};$('hardware').innerHTML=`<span class="muted small">RAM ${bytes(m.MemTotal-m.MemAvailable)} / ${bytes(m.MemTotal)} · ${t('磁盘可用','Disk free')} ${bytes(disk.free)} · Load ${(h.load||[]).map(n=>Number(n).toFixed(1)).join(' / ')}</span><div>${(h.gpu||[]).map(g=>`<span class="gpu">GPU ${esc(g.index)} · ${esc(g.utilization)}% · ${esc(g.memory_used_mib)} / ${esc(g.memory_total_mib)} MiB</span>`).join('')}</div><div class="muted small" style="margin-top:6px">${t('GPU 为整机统计，含其他任务与占卡进程；不作为实验进展判据。','GPU figures are host-wide, including reservations and other jobs; they do not establish experiment progress.')}</div>`;
if(h.compute_processes?.length){$('hardware').insertAdjacentHTML('beforeend',`<details><summary>${t('当前用户的 GPU 进程（未自动归属实验）','Current-user GPU processes (not automatically attributed to experiments)')} · ${h.compute_processes.length}</summary><pre>${h.compute_processes.map(p=>esc(p.pid+'  '+p.name+'  '+p.memory_mib+' MiB  '+p.cwd)).join('\n')}</pre></details>`)}
const q=$('search').value.toLowerCase(),filter=$('filter').value;const rows=sessions.filter(s=>[s.project,s.session_id,s.pid,s.pane?.label,s.engine].join(' ').toLowerCase().includes(q)&&(filter==='all'||s.health===filter));$('sessions').innerHTML=rows.length?rows.map(s=>`<button class="session ${selected===s.id?'selected':''}" data-session="${esc(s.id)}" data-project="${esc(s.project_id)}"><div class="row"><span class="session-name">${esc(s.pane?.label||s.session_id?.slice(0,8)||'PID '+s.pid)}</span><span class="badge">${esc(s.engine.toUpperCase())}</span></div><div class="path">${esc(s.project)}</div><div class="row"><span class="small ${s.health==='attention'?'warning':'phase'}">${esc(ph(s.phase))}</span><span class="count">PID ${s.pid}</span></div></button>`).join(''):`<div class="empty">${t('尚未发现匹配的会话。可用 register / attach 接入项目或现有对话。','No matching sessions. Use register / attach to observe a project or existing conversation.')}</div>`;
$('projects').innerHTML=projects.map(p=>`<button class="session ${!selected&&selectedProject===p.id?'selected':''}" data-project="${esc(p.id)}"><div class="row"><span>${esc(p.name)}</span><span class="count">${p.jobs.length} jobs</span></div><div class="path">${esc(p.path)}</div>${p.owner_alive?'<span class="badge">'+esc(p.mode)+'</span>':''}</button>`).join('');
const p=project(),s=sessions.find(s=>s.id===selected);const detailKey=selectedProject+':'+selected;const openDetails=lastDetailKey===detailKey?[...$('detail').querySelectorAll('details')].map(d=>d.open):[];const messageScroll=$('detail').querySelector('.messages')?.scrollTop||0;let html='';if(p){html+=`<section class="panel"><div class="panel-head"><div><span class="eyebrow">${s?esc(s.engine)+' / SESSION':'PROJECT'}</span><h2>${esc(s?.session_id||p.name)}</h2></div><span class="badge ${s?.health==='attention'?'warning':''}">${s?esc(ph(s.phase)):esc(p.status||'OBSERVING')}</span></div><div class="path">${esc(p.path)}</div><div class="details-grid"><div class="metric"><small>${t('接入程度','Coverage')}</small><div>${s?t(s.coverage==='transcript'?'已绑定会话记录':'仅进程，待绑定',s.coverage==='transcript'?'Transcript bound':'Process only'):t('项目作业','Project jobs')}</div></div><div class="metric"><small>${t('最近会话事件','Last session event')}</small><div>${ago(s?.last_event_at)}</div></div><div class="metric"><small>${t('Lemvo 控制器','Lemvo controller')}</small><div>${p.owner_alive?'PID '+p.owner_pid:t('未接管 / 未运行','Not attached / not running')}</div></div></div>${s?.warning?notice(s.warning):''}${s?.parse_warning?notice(s.parse_warning,true):''}${s?.shared_process?notice(t('此后台进程承载多条对话。无法确认归属的子进程不会分配给某一条对话。','This backend hosts multiple conversations. Unattributed children are not assigned to a specific conversation.'),true):''}${p.warning?notice(p.warning):''}`;
if(s?.pending_tools?.length)html+=`<details open><summary>${t('待返回的工具请求（不等于已开始执行）','Pending tool requests (execution not confirmed)')}</summary>${s.pending_tools.map(x=>`<pre>${esc(x.name)} · ${esc(ago(x.since))}\n${esc(x.command)}</pre>`).join('')}</details>`;if(s?.children?.length)html+=`<details><summary>${t('关联子进程','Child processes')} (${s.children.length})</summary><pre>${s.children.map(c=>esc(`${c.pid}  ${c.state}  ${c.name}  ${bytes(c.rss_bytes)}`)).join('\n')}</pre></details>`;html+='</section>';
html+=`<section class="panel"><div class="panel-head"><h2>${t('项目实验作业','Project experiments')}</h2><span class="count">${p.jobs.length}</span></div>${p.jobs.length?'':`<div class="muted small">${t('尚无登记作业。不会把整机 GPU 活动猜成当前会话的实验。','No registered jobs. Host GPU activity is not attributed to this conversation.')}</div>`}`;for(const j of p.jobs){const cur=j.progress?.current,total=j.progress?.total,pct=Number.isFinite(cur)&&total>0?Math.max(0,Math.min(100,cur/total*100)):null;html+=`<div class="job"><div class="row"><strong class="mono small">${esc(j.run_id||j.id)}</strong><span class="badge">${esc(j.status)}</span></div><div class="row small" style="margin-top:6px"><span class="phase">${esc(ph(j.phase))}</span><span class="muted">PID ${esc(j.pid)} · ${t('进度观测','Counter observation')} ${ago(j.last_progress_at)}</span></div>${pct!==null?`<div class="progress"><span style="width:${pct}%"></span></div><div class="muted mono small">${cur} / ${total} ${esc(j.progress.unit)}</div>`:''}${j.detail?`<div class="small muted">${esc(j.detail)}</div>`:''}${j.warning?notice(j.warning):''}${j.log_tail?`<details><summary>${t('查看作业日志','Job log')}</summary><pre>${esc(j.log_tail)}</pre></details>`:''}</div>`}html+='</section>';
if(s?.messages?.length)html+=`<section class="panel"><div class="panel-head"><h2>${t('最近对话','Recent conversation')}</h2><span class="small muted">${t('只读摘录','Read-only excerpt')}</span></div><div class="messages">${s.messages.map(m=>`<div class="message"><b>${esc(m.role.toUpperCase())}</b>${esc(m.text)}</div>`).join('')}</div></section>`;
}else html=`<section class="panel empty">${t('选择左侧会话或项目查看详情。','Select a session or project to inspect.')}</section>`;$('detail').innerHTML=html;[...$('detail').querySelectorAll('details')].forEach((d,i)=>{if(openDetails[i]!==undefined)d.open=openDetails[i]});const messageBox=$('detail').querySelector('.messages');if(messageBox&&lastDetailKey===detailKey)messageBox.scrollTop=messageScroll;lastDetailKey=detailKey;
const enabled=p&&p.owner_alive&&snap.controls_enabled&&!snap.stale&&p.status!=='COMPLETED';for(const id of ['guided','unattended','send','steer'])$(id).disabled=!enabled||busy;$('controlHint').textContent=enabled?t(`操作目标：${p.name} 的 Lemvo 控制器。${p.pending_guidance} 条指导待领取。`,`Target: ${p.name}'s Lemvo controller. ${p.pending_guidance} guidance items queued.`):t('当前为只读观察，或此项目没有可验证的 Lemvo 控制器。不会向裸终端模拟按键。','Read-only observation, or no verified Lemvo controller for this project. No simulated terminal keystrokes.');}
async function refresh(){if(!token)return;try{snap=await api('/api/snapshot');$('login').classList.add('hidden');$('main').classList.remove('hidden');render();const events=await api('/api/events');$('events').innerHTML=events.slice(-8).reverse().map(e=>`<div class="event"><span class="mono muted">${new Date(e.recorded_at*1000).toLocaleTimeString()}</span> · ${esc(e.type==='operator_action'?e.kind:ph(e.phase))} <span class="muted">${esc(e.health||e.result?.status||'')}</span></div>`).join('')||`<div class="muted small">${t('等待状态变化','Waiting for state changes')}</div>`;}catch(e){$('connection').className='small stale warning';$('connection').textContent=t('连接不可用','Disconnected');if(snap){snap.stale=true;render()}else{$('login').classList.remove('hidden');$('main').classList.add('hidden')}if(String(e.message).includes('token'))sessionStorage.removeItem('lemvo-console-token');}}
async function action(kind,extra){const p=project();if(!p||busy)return;if(kind==='mode'&&!confirm(t(`切换 ${p.name} 为${extra.mode==='guided'?'半自动':'全自动'}？在安全交接点生效，当前训练继续。`,`Switch ${p.name} to ${extra.mode}? Applies at a safe boundary; current training continues.`)))return;const signature=JSON.stringify([p.id,kind,extra]);if(!delivery||delivery.signature!==signature)delivery={signature,id:crypto.randomUUID()};busy=true;render();try{const r=await api('/api/action',{kind,project_id:p.id,owner_pid:p.owner_pid,owner_start:p.owner_start,request_id:delivery.id,...extra});$('receipt').textContent=t('请求回执：','Receipt: ')+r.status+' · '+r.detail;delivery=null;if(kind==='steer')$('steer').value='';await refresh()}catch(e){toast(e.message)}finally{busy=false;render()}}
$('connect').onclick=()=>{token=$('token').value.trim();sessionStorage.setItem('lemvo-console-token',token);refresh()};$('token').onkeydown=e=>{if(e.key==='Enter')$('connect').click()};$('logout').onclick=()=>{token='';sessionStorage.removeItem('lemvo-console-token');$('main').classList.add('hidden');$('login').classList.remove('hidden');$('token').value=''};$('language').onclick=()=>{lang=lang==='zh'?'en':'zh';localStorage.setItem('lemvo-console-lang',lang);render()};$('search').oninput=render;$('filter').onchange=render;document.addEventListener('click',e=>{const b=e.target.closest('button[data-project]');if(b)select(b.dataset.session||null,b.dataset.project)});$('guided').onclick=()=>action('mode',{mode:'guided'});$('unattended').onclick=()=>action('mode',{mode:'unattended'});$('send').onclick=()=>action('steer',{text:$('steer').value});translate();refresh();timer=setInterval(refresh,5000);
</script>
